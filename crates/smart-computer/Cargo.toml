[package]
name = "smart-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Graphics", "Graphics_Capture",
  "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Graphics_Imaging",
  "Media_Ocr", "Globalization", "Storage_Streams",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Pipes",
  "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT",
  "Win32_System_StationsAndDesktops",
  "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem",
] }
