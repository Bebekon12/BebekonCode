[workspace]
members = ["crates/agent-core", "src-tauri"]
default-members = ["crates/agent-core"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
