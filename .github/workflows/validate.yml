name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:versions
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - name: cargo test --workspace --locked
        shell: pwsh
        run: |
          # Failing test names and panics become annotations visible without the raw log.
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object -FilePath cargo-test.log
          $code = $LASTEXITCODE
          Select-String -Path cargo-test.log -Pattern '(panicked at|FAILED|^failures:|left:|right:)' -Context 0,3 |
            Select-Object -First 30 | ForEach-Object { "::error title=cargo test::$($_.Line -replace '[\r\n]', ' ')" }
          exit $code
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --reporter=github
